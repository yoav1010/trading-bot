name: Paper trade

# Runs the bot a couple of minutes after each 15-minute bar closes.
# GitHub may delay scheduled runs by a few minutes when it is busy.
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch: {}   # "Run workflow" button for manual runs

permissions:
  contents: write         # needed to push logs to the paper-log branch

concurrency:
  group: paper-trade      # never run two copies at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code (main)
        uses: actions/checkout@v4

      - name: Check out logs and state (paper-log branch)
        uses: actions/checkout@v4
        with:
          ref: paper-log
          path: _log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the bot (paper trading only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          BOT_STATE_FILE: _log/state/bot_state.json
          BOT_LOG_DIR: _log/logs
        run: python -m bot.live

      - name: Save logs and state to paper-log
        if: always()      # keep the logs even if one market errored
        working-directory: _log
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs state
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Paper-trading run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin paper-log
          fi
